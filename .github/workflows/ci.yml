name: CI
# 推送/PR:shellcheck 生命周期脚本 + SPK 组装 + 结构断言(无 DSM 可用,结构校验即门禁;
# 真机安装验证须用户在 DSM 7.2 套件中心手动安装,未签名包确认第三方警告即可)
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck(bash 严格模式与 sh 兼容性)
        run: |
          shellcheck -s sh spk/scripts/*
          shellcheck -s sh tests/run-tests.sh
      - name: compose 模板校验
        run: docker compose -f spk/package/compose.yml config -q
      - name: 向导 JSON 合法性
        run: python3 -c "import json;json.load(open('spk/WIZARD_UIFILES/install_uifile'));json.load(open('spk/conf/privilege'))"
      - name: 共享资产与 hub 模板对齐(漂移门禁)
        # 模板真相源=hub 仓 deploy/nas/。列车 bump PR 窗口:读 hub 同列车分支模板
        # (消灭「物化已新版、模板仍旧版」的合并时序窗,1.20.0 首航实测);脚本与模板
        # 一律 gh api 实时读(raw CDN ~5min 缓存=幽灵模板)。push 事件 head_ref 空→main。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=main
          case "${{ github.head_ref }}" in train/*) REF="${{ github.head_ref }}";; esac
          gh api "repos/pigeonbox/pigeonbox/contents/deploy/nas/sync.sh?ref=$REF" --jq .content | base64 -d > /tmp/nas-sync.sh
          PB_NAS_TEMPLATE_REF="$REF" bash /tmp/nas-sync.sh check --platform synology --dir .

  script-smoke:
    # 生命周期脚本 mock 冒烟(伪造 docker 与 DSM 环境变量):postinst .env 生成/
    # start-stop-status 全流程/postupgrade 版本对齐。DSM 集成仍需真机。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tests/run-tests.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 组装 SPK(CI 版本 0.0.0-0001)
        run: ./scripts/build-spk.sh 0.0.0 0001
      - name: 结构断言
        run: |
          SPK=dist/pigeonbox_0.0.0-0001.spk
          test -s "$SPK"
          # 外层必须是未压缩 tar(gzip 会被套件中心拒收)
          file "$SPK" | grep -qi 'tar archive'
          # 顶层清单齐备
          tar -tf "$SPK" | sort > /tmp/spk.list
          for f in INFO package.tgz scripts/ scripts/start-stop-status scripts/postinst \
                   conf/privilege WIZARD_UIFILES/install_uifile \
                   PACKAGE_ICON.PNG PACKAGE_ICON_256.PNG LICENSE; do
            grep -qx "$f" /tmp/spk.list || { echo "缺 $f"; exit 1; }
          done
          # INFO 关键字段
          tar -xOf "$SPK" INFO | grep -q '^package="pigeonbox"$'
          tar -xOf "$SPK" INFO | grep -q '^arch="noarch"$'
          tar -xOf "$SPK" INFO | grep -q '^install_dep_packages="ContainerManager>=24.0.2-1535"$'
          tar -xOf "$SPK" INFO | grep -q '^version="0.0.0-0001"$'
          # package.tgz 内容与脚本可执行位
          tar -tvf "$SPK" | grep -q 'scripts/start-stop-status' && \
            tar -tvf "$SPK" | awk '$1 ~ /^-rwx/ && $0 ~ /scripts\/start-stop-status/ {found=1} END{exit !found}'
          # 外层未压缩 tar 用 -xOf 取 package.tgz 原始字节,再由第二个 tar 解包(gzip)
          # 2026-10-22:先落临时文件再解包,不走管道 —— 管道让第二个 tar 从 stdin 读
          # 归档,对 tar 实现(GNU 块因子/流式读)敏感,实弹出现过同一 commit 的
          # push 事件红(PR 事件绿)的间歇性 crc error。落文件后校验路径确定。
          tar -xOf "$SPK" package.tgz > /tmp/pkg.tgz
          tar -tzf /tmp/pkg.tgz | grep -qx compose.yml
          tar -tzf /tmp/pkg.tgz | grep -qx env.example
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: spk
          path: dist/*.spk
          retention-days: 14
          if-no-files-found: error
