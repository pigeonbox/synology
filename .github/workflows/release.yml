name: Release
# 打 v* tag → noarch SPK 发布:
#   1. build: 组装 SPK
#   2. release: 挂本仓 Release(GITHUB_TOKEN 同仓写即可)
#   3. attach-to-hub: 回挂生态主仓 pigeonbox/pigeonbox(tag synology-v*,
#      与 fnos-v*/openwrt-v* 同模式);跨仓写用 SYNOLOGY_PAT;
#      断链必须响(2026-10-08 拔除 continue-on-error——静默放行只会让 hub 统一出口缺资产)
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑打包+双挂
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.1.0)。仅重跑 SPK 打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,产物与 tag 严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - name: 版本一致性断言(VERSION 与 tag 对齐——错 tag/错内容拒发)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION/tag 错位"; exit 1; }
          fi
      - name: 组装 SPK(tag v0.1.0 → 包版本 0.1.0-0001)
        run: |
          VER="${{ inputs.version || github.ref_name }}"
          ./scripts/build-spk.sh "${VER#v}" 0001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spk
          path: dist/*.spk
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spk
          path: rel
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox Synology DSM ${VER}" \
              --notes "群晖 DSM 7.2+ 套件包(noarch,见 Assets)。要求:套件中心先安装 Container Manager(24.0.2+)。安装:套件中心 → 手动安装 → 上传 SPK → 按向导设端口/数据目录/管理员密码。详见 README。"
          gh release upload "${VER}" rel/*.spk --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spk
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: synology-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/synology](https://github.com/pigeonbox/synology) · **完整变更日志**: [%s](https://github.com/pigeonbox/synology/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "群晖 DSM 7.2+ 套件包(noarch,见 Assets)。安装说明见 synology 仓 README。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox Synology DSM ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" rel/*.spk --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: synology-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"synology\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
